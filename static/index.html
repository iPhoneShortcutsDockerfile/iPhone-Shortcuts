<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POST辞書管理</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090d15;color:#f3f5fb}
*{box-sizing:border-box}body{max-width:900px;margin:auto;padding:22px 15px 60px}h1{font-size:25px;margin:4px 0}.sub{font-size:13px;color:#9aa8bf;margin:5px 0 20px}
.toolbar,.actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}input,select{font:inherit;color:inherit;min-width:0;border:1px solid #303b50;border-radius:10px;background:#151e2d;padding:10px;width:100%}
button{font:inherit;color:inherit;border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#665cf0;font-weight:650}button.secondary{background:#27334a}button.danger{background:#713448}button.add{background:#244d40;color:#c5f8df}
#password{flex:1;min-width:190px}#status{min-height:24px;color:#aab8ce;font-size:13px;margin:12px 0}.rule{background:#111925;border:1px solid #2c384d;border-radius:18px;padding:15px;margin:14px 0}.rulehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.rule-title{font-weight:750;font-size:14px}
.section{border:1px solid #354158;border-radius:14px;overflow:hidden;background:#0d1420;margin-top:13px}.section-title{padding:11px 12px;background:#1a2638;font-size:13px;color:#d2def1;font-weight:750}
.dict-body{padding:8px}.dict-item{border:1px solid #2b3a51;background:#111b2a;border-radius:11px;padding:9px;margin:7px 0}.item-head{display:grid;grid-template-columns:minmax(0,1fr) 112px auto;gap:7px;align-items:center}.item-head input{background:#0b1320}.item-head select{background:#202d42}.text-value{margin-top:8px}.nested{margin:9px 0 0 12px;padding-left:10px;border-left:2px solid #40516c}.nested>.nested-title{font-size:11px;color:#93a8c6;margin-bottom:5px}.dict-actions{padding:8px 0 2px}.empty{font-size:12px;color:#8191aa;padding:6px}.hint{font-size:12px;color:#91a0b8;line-height:1.7;margin-top:18px}
@media(max-width:560px){body{padding:16px 11px 50px}.toolbar>*{width:100%}.rule{padding:11px}.item-head{grid-template-columns:minmax(0,1fr) 88px auto;gap:5px}.item-head input,.item-head select{padding:9px 7px;font-size:13px}.item-head button{padding:8px 10px}.nested{margin-left:7px;padding-left:8px}}
</style></head><body>
<h1>POST辞書管理</h1><p class="sub">iPhoneの「辞書」と同じように、値をTextまたは辞書に設定できます。辞書の中にさらに辞書を作成できます。</p>
<div class="toolbar"><input id="password" type="password" placeholder="管理者パスワード" autocomplete="current-password"><button id="load" class="secondary">読み込み</button><button id="save">すべて保存</button></div>
<div id="status">管理者パスワードを入力して読み込んでください。</div><div id="rules"></div><div class="actions"><button id="add" class="secondary">＋ 辞書を追加</button></div>
<p class="hint">各項目は「キー」と「値」で構成されます。値の種類をText／辞書から選択できます。POST側に入れ子の辞書を設定した場合、受信したJSON内の同じ階層・キー・値が一致するか確認します。返却内容は設定した入れ子構造のままJSONで返します。</p>
<script>
const $=id=>document.getElementById(id),root=$('rules');let rules=[];
const PASSWORD_STORAGE_KEY='post_dictionary_admin_password',passwordInput=$('password');
const status=s=>$('status').textContent=s;
passwordInput.value=localStorage.getItem(PASSWORD_STORAGE_KEY)||'';
passwordInput.addEventListener('input',()=>localStorage.setItem(PASSWORD_STORAGE_KEY,passwordInput.value));
const headers=()=>({'Authorization':passwordInput.value,'Content-Type':'application/json'});
const make=(post={},response={})=>({post:structuredClone(post),response:structuredClone(response)});
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function renderDict(obj,onChange,depth=0){
 const body=el('div','dict-body');
 const entries=Object.entries(obj);
 if(!entries.length)body.append(el('div','empty','項目はありません'));
 for(const [originalKey,originalValue] of entries){
  const item=el('div','dict-item'),head=el('div','item-head');
  const key=el('input');key.placeholder='キー';key.value=originalKey;key.setAttribute('aria-label','キー');
  const type=el('select');type.setAttribute('aria-label','値の種類');
  [['text','Text'],['dict','辞書']].forEach(([v,t])=>{const o=el('option','',t);o.value=v;type.append(o)});
  type.value=originalValue!==null&&typeof originalValue==='object'&&!Array.isArray(originalValue)?'dict':'text';
  const del=el('button','danger','−');del.title='項目を削除';
  key.addEventListener('change',()=>{const next=key.value.trim();if(!next){status('キーを入力してください');key.value=originalKey;return}if(next!==originalKey&&Object.prototype.hasOwnProperty.call(obj,next)){status('同じ階層に同じキーがあります');key.value=originalKey;return}const pairs=Object.entries(obj).map(([k,v])=>[k===originalKey?next:k,v]);for(const k of Object.keys(obj))delete obj[k];for(const [k,v] of pairs)obj[k]=v;onChange()});
  del.onclick=()=>{delete obj[originalKey];onChange()};
  type.addEventListener('change',()=>{obj[originalKey]=type.value==='dict'?{}:'';onChange()});
  head.append(key,type,del);item.append(head);
  if(type.value==='text'){
   const value=el('input','text-value');value.placeholder='テキスト';value.value=String(originalValue??'');value.addEventListener('input',()=>{obj[originalKey]=value.value});item.append(value);
  }else{
   const nested=el('div','nested');nested.append(el('div','nested-title','辞書の内容'));
   nested.append(renderDict(originalValue, onChange, depth+1));item.append(nested);
  }
  body.append(item);
 }
 const actions=el('div','dict-actions'),add=el('button','add','＋ 追加');
 add.onclick=()=>{let k='';let n=1;while(Object.prototype.hasOwnProperty.call(obj,k))k='新しいキー'+n++;obj[k]='';onChange()};
 actions.append(add);body.append(actions);return body;
}
function render(){
 root.innerHTML='';
 rules.forEach((rule,index)=>{
  const card=el('section','rule'),head=el('div','rulehead');head.append(el('div','rule-title','辞書 '+(index+1)));
  const del=el('button','danger','辞書を削除');del.onclick=()=>{rules.splice(index,1);render()};head.append(del);card.append(head);
  for(const [type,title] of [['post','POST'],['response','返却する内容']]){
   const section=el('div','section');section.append(el('div','section-title',title));section.append(renderDict(rule[type],()=>render()));card.append(section);
  }
  root.append(card);
 });
}
function validDictionary(value){return value&&typeof value==='object'&&!Array.isArray(value)&&Object.entries(value).every(([k,v])=>k.trim()!==''&&(typeof v==='string'||validDictionary(v)))}
$('add').onclick=()=>{rules.push(make());render()};
$('load').onclick=async()=>{if(!passwordInput.value){status('管理者パスワードを入力してください');return}status('読み込み中…');try{const res=await fetch('/api/records',{headers:headers()}),data=await res.json();if(!res.ok)throw Error(data.error||'読み込み失敗');rules=(data.records||[]).map(x=>make(x.post||{},x.response||{}));render();status(rules.length+'件読み込みました')}catch(e){status(e.message)}};
$('save').onclick=async()=>{if(!passwordInput.value){status('管理者パスワードを入力してください');return}for(let i=0;i<rules.length;i++){for(const [type,title] of [['post','POST'],['response','返却する内容']]){if(!validDictionary(rules[i][type])||!Object.keys(rules[i][type]).length){status('辞書 '+(i+1)+' の'+title+'に有効な項目を1つ以上設定してください');return}}}status('保存中…');try{const res=await fetch('/api/records',{method:'PUT',headers:headers(),body:JSON.stringify({records:rules})}),data=await res.json();if(!res.ok)throw Error(data.error||'保存失敗');status(data.count+'件の辞書を保存しました')}catch(e){status(e.message)}};
render();
</script></body></html>
