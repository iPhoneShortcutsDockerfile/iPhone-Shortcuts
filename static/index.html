<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON管理</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#eef2ff}
*{box-sizing:border-box}body{margin:0;padding:22px;max-width:920px;margin:auto}
h1{font-size:24px;margin:0 0 18px}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
input,textarea,select,button{font:inherit;border-radius:10px;border:1px solid #34405c;background:#151e33;color:#eef2ff;padding:11px}
input{min-width:0}#password{width:min(100%,360px)}button{cursor:pointer;background:#5b5ce2;border:0;font-weight:650}button.secondary{background:#26334e}button.danger{background:#8d3349}
.record{border:1px solid #2b3854;border-radius:16px;padding:16px;margin:14px 0;background:#111a2d}
.head{display:grid;grid-template-columns:minmax(140px,1fr) minmax(130px,180px);gap:10px;margin-bottom:12px}
textarea{width:100%;min-height:150px;resize:vertical;font-family:ui-monospace,monospace}
.jsonlabel{display:flex;justify-content:space-between;align-items:center;margin:10px 0 7px;color:#b9c6e2}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
#status{color:#9eadd0;min-height:24px}.hint{color:#91a1c2;font-size:13px}
@media(max-width:560px){body{padding:14px}.head{grid-template-columns:1fr}.top{align-items:stretch}#password{width:100%}}
</style></head><body>
<h1>JSON管理</h1>
<div class="top">
  <input id="password" type="password" placeholder="管理者パスワード" autocomplete="current-password">
  <button id="load" class="secondary">読み込み</button>
  <button id="save">すべて保存</button>
</div>
<div id="status">管理者パスワードを入力してください。</div>
<div id="records"></div>
<div class="actions"><button id="add" class="secondary">＋追加</button></div>
<p class="hint">各ブロックに認証番号とJSON内容を入力します。JSON形式はObjectまたはArrayに対応。保存時、一覧全体を置き換えます。</p>
<script>
const $=id=>document.getElementById(id), list=$('records');
let records=[];
const auth=()=>({'Authorization':'Bearer '+$('password').value,'Content-Type':'application/json'});
function status(s){$('status').textContent=s}
function pretty(v){return JSON.stringify(v,null,2)}
function parse(text){const v=JSON.parse(text);if(v===null||typeof v!=='object')throw Error('JSONの最上位はObjectまたはArrayにしてください');return v}
function render(){
 list.innerHTML='';
 records.forEach((r,i)=>{
  const card=document.createElement('section');card.className='record';
  const head=document.createElement('div');head.className='head';
  const number=document.createElement('input');number.placeholder='認証番号';number.value=r.number||'';number.setAttribute('aria-label','認証番号');
  number.addEventListener('input',()=>records[i].number=number.value);
  const format=document.createElement('select');format.innerHTML='<option value="object">JSON形式：Object</option><option value="array">JSON形式：Array</option>';
  format.value=Array.isArray(r.json)?'array':'object';
  const area=document.createElement('textarea');area.spellcheck=false;area.value=pretty(r.json??{});
  format.addEventListener('change',()=>{
    try{let v=parse(area.value);if(format.value==='array'&&!Array.isArray(v))v=[];if(format.value==='object'&&(Array.isArray(v)||v===null))v={};area.value=pretty(v);records[i].json=v}
    catch(e){area.value=format.value==='array'?'[]':'{}';records[i].json=format.value==='array'?[]:{}}
  });
  area.addEventListener('input',()=>{try{records[i].json=parse(area.value);area.style.borderColor='#34405c'}catch(e){area.style.borderColor='#c34d65'}});
  const label=document.createElement('div');label.className='jsonlabel';label.textContent='JSON内容';
  const remove=document.createElement('button');remove.className='danger';remove.textContent='このブロックを削除';remove.onclick=()=>{records.splice(i,1);render()};
  head.append(number,format);card.append(head,label,area);
  const actions=document.createElement('div');actions.className='actions';actions.append(remove);card.append(actions);list.append(card);
 });
}
function addRecord(){records.push({number:'',json:{}});render()}
$('add').onclick=addRecord;
$('load').onclick=async()=>{
 if(!$('password').value){status('管理者パスワードを入力してください');return}
 status('読み込み中…');
 try{const res=await fetch('/api/records',{headers:auth()});const data=await res.json();if(!res.ok)throw Error(data.error||'読み込み失敗');records=data.records||[];render();status(records.length+'件読み込みました')}
 catch(e){status(e.message)}
};
$('save').onclick=async()=>{
 if(!$('password').value){status('管理者パスワードを入力してください');return}
 try{
  const clean=records.map(r=>({number:String(r.number||'').trim(),json:r.json}));
  const numbers=clean.map(r=>r.number);if(clean.some(r=>!r.number))throw Error('認証番号を入力してください');
  if(new Set(numbers).size!==numbers.length)throw Error('認証番号が重複しています');
  const res=await fetch('/api/records',{method:'PUT',headers:auth(),body:JSON.stringify({records:clean})});
  const data=await res.json();if(!res.ok)throw Error(data.error||'保存失敗');status(data.count+'件保存しました');
 }catch(e){status(e.message)}
};
// 変更のたびに入力値を状態へ反映し、余計な再描画は行わない。
$('password').addEventListener('input',()=>{status($('password').value?'パスワード入力中':'管理者パスワードを入力してください。')});
addRecord();
</script></body></html>
